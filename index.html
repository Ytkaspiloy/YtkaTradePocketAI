<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>TradeSignal Pro • Премиум Бот</title>
    <link rel="icon" type="image/png" href="https://image2url.com/images/1766001097047-30fbff9b-a368-4dbf-965a-4f3ce2de2e5e.png">
    <link rel="stylesheet" href="style.css">
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="logo-area">
                <img src="https://image2url.com/images/1766001097047-30fbff9b-a368-4dbf-965a-4f3ce2de2e5e.png" alt="Logo" class="logo-img">
                <span class="logo-text">TradeSignal <span class="pro-badge">PREMIUM</span></span>
            </div>
            <div class="header-status">
                <span class="status-dot"></span> Онлайн
            </div>
        </header>

        <main class="dashboard">
            <!-- Левая панель: Активы + Поиск -->
            <aside class="assets-panel">
                <div class="search-box">
                    <input type="text" id="assetSearch" placeholder="🔍 Поиск актива...">
                </div>
                <div class="panel-label">FOREX</div>
                <div class="assets-list" id="assetsList"></div>
            </aside>

            <!-- Центр: График + Управление -->
            <section class="main-content">
                <!-- Верхняя панель -->
                <div class="control-bar">
                    <div class="asset-display">
                        <h2 id="currentAsset">EUR/USD</h2>
                        <span class="live-badge">● LIVE</span>
                    </div>
                    
                    <!-- Таймфрейм пилсы -->
                    <div class="timeframe-pills" id="timeframePills">
                        <button class="tf-pill" data-tf="1">1 мин</button>
                        <button class="tf-pill" data-tf="2">2 мин</button>
                        <button class="tf-pill" data-tf="3">3 мин</button>
                        <button class="tf-pill active" data-tf="5">5 мин</button>
                        <button class="tf-pill" data-tf="10">10 мин</button>
                        <button class="tf-pill" data-tf="15">15 мин</button>
                        <button class="tf-pill" data-tf="30">30 мин</button>
                        <button class="tf-pill" data-tf="60">1 час</button>
                        <button class="tf-pill" data-tf="240">4 часа</button>
                    </div>
                </div>

                <!-- График -->
                <div class="chart-wrapper" id="chartWrapper">
                    <div class="chart-container" id="tradingviewChart">
                        <div class="chart-placeholder" id="chartPlaceholder">
                            <div class="loading-spinner"></div>
                        </div>
                    </div>
                    
                    <!-- Оверлей анализа (поверх графика) -->
                    <div class="analysis-overlay" id="analysisOverlay">
                        <div class="analysis-card">
                            <div class="analysis-icon">🔬</div>
                            <div class="analysis-title">АНАЛИЗ РЫНКА</div>
                            <div class="analysis-detail" id="analysisDetail">Инициализация...</div>
                            <div class="progress-container">
                                <div class="progress-track">
                                    <div class="progress-fill" id="progressFill"></div>
                                </div>
                                <span class="progress-percent" id="progressPercent">0%</span>
                            </div>
                            <div class="analysis-indicators">
                                <span id="indicator1">● RSI</span>
                                <span id="indicator2">● MACD</span>
                                <span id="indicator3">● MA</span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Оверлей блокировки (во время таймера) -->
                    <div class="lock-overlay" id="lockOverlay">
                        <div class="lock-content">
                            <div class="lock-icon">🔒</div>
                            <div class="lock-title">ОЖИДАНИЕ</div>
                            <div class="lock-timer" id="lockTimerValue">05:00</div>
                            <div class="lock-subtitle">Таймер истекает. Дождитесь окончания.</div>
                        </div>
                    </div>
                </div>

                <!-- Нижняя панель: Кнопка + Сигнал -->
                <div class="action-panel">
                    <button class="generate-btn" id="generateBtn">
                        <span class="btn-icon">⚡</span>
                        <span class="btn-text">ПОЛУЧИТЬ СИГНАЛ</span>
                    </button>

                    <!-- Карточка сигнала -->
                    <div class="signal-card" id="signalCard">
                        <div class="signal-header">
                            <span class="signal-badge" id="signalBadge">СИГНАЛ</span>
                            <span class="signal-timeframe" id="signalTimeframe">5 мин</span>
                        </div>
                        <div class="signal-body">
                            <div class="signal-direction" id="signalDirection">
                                <span class="signal-arrow" id="signalArrow">—</span>
                                <span class="signal-type" id="signalType">Ожидание</span>
                            </div>
                            <div class="signal-stats">
                                <div class="stat">
                                    <span class="stat-label">Вероятность</span>
                                    <span class="stat-value probability" id="signalProbability">--</span>
                                </div>
                                <div class="stat">
                                    <span class="stat-label">Экспирация</span>
                                    <span class="stat-value" id="signalExpiry">--</span>
                                </div>
                                <div class="stat">
                                    <span class="stat-label">Волатильность</span>
                                    <span class="stat-value" id="signalVolatility">--</span>
                                </div>
                            </div>
                        </div>
                        <div class="signal-advice" id="signalAdvice"></div>
                    </div>
                </div>
            </section>

            <!-- Правая панель: История -->
            <aside class="history-panel">
                <h3>📋 История</h3>
                <div class="history-list" id="historyList">
                    <div class="empty-history">Нет сигналов</div>
                </div>
                <button class="clear-btn" id="clearHistory">Очистить</button>
            </aside>
        </main>

        <footer class="footer">
            <span>© 2026 TradeSignal Premium</span>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
